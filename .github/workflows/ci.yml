name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: traintrack
          POSTGRES_PASSWORD: traintrack
          POSTGRES_DB: traintrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U traintrack -d traintrack"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13.7-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: traintrack
          RABBITMQ_DEFAULT_PASS: traintrack
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://traintrack:traintrack@localhost:5432/traintrack
      TEST_DATABASE_URL: postgresql+psycopg://traintrack:traintrack@localhost:5432/traintrack_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      AMQP_URL: amqp://traintrack:traintrack@localhost:5672/%2F
      TRAINTRACK_API_URL: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Ruff
        run: ruff check traintrack tests scripts
      - name: Mypy
        run: mypy traintrack
      - name: Pytest with coverage
        run: pytest -q --cov=traintrack --cov-report=term --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    name: Frontend (lint, typecheck, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API/worker image
        run: docker build -t traintrack:ci .

  e2e-kind:
    name: E2E on kind
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create cluster, build/load image, deploy
        run: ./scripts/kind-up.sh
        env:
          TRAINTRACK_SKIP_GPU_DRYRUN: "1"
      - name: Submit a run and assert SUCCEEDED
        run: |
          kubectl -n traintrack port-forward svc/traintrack-api 18011:8010 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:18011/healthz && break
            sleep 2
          done
          python3 - <<'PY'
          import json, time, urllib.request
          base = "http://localhost:18011"
          key = "tt_dev_local_key_do_not_use_in_prod"
          def call(method, path, payload=None, idem=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"X-API-Key": key, "Content-Type": "application/json"}
              if idem:
                  headers["Idempotency-Key"] = idem
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())
          experiment = call("POST", "/api/experiments", {"name": "ci-e2e"})
          snapshot = call("GET", "/api/snapshots")["snapshots"][0]
          run = call("POST", "/api/runs", {
              "experiment_id": experiment["id"],
              "job_kind": "train",
              "hyperparams": {"lr": 0.001, "batch_size": 128, "epochs": 1},
              "dataset_snapshot_id": snapshot["id"],
              "timeout_seconds": 900,
          }, idem="ci-e2e-run")
          deadline = time.time() + 600
          while time.time() < deadline:
              detail = call("GET", f"/api/runs/{run['id']}")
              if detail["status"] in ("SUCCEEDED", "FAILED", "CANCELED"):
                  print(detail["status"])
                  assert detail["status"] == "SUCCEEDED", detail
                  break
              time.sleep(3)
          else:
              raise SystemExit("run did not finish")
          PY
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n traintrack get pods
          kubectl -n traintrack logs deploy/traintrack-worker --tail=200 || true
          kubectl -n traintrack logs deploy/traintrack-api --tail=200 || true
