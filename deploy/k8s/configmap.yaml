apiVersion: v1
kind: ConfigMap
metadata:
  name: traintrack-config
  namespace: traintrack
data:
  DATABASE_URL: postgresql+psycopg://traintrack:traintrack@postgres:5432/traintrack
  REDIS_URL: redis://redis:6379/0
  AMQP_URL: amqp://traintrack:traintrack@rabbitmq:5672/%2F
  TRAINTRACK_API_URL: http://traintrack-api:8010
  TRAINTRACK_API_HOST: 0.0.0.0
  TRAINTRACK_API_PORT: "8010"
  TRAINTRACK_RATE_LIMIT: "3000"
  TRAINTRACK_EXECUTOR: kubernetes
  TRAINTRACK_K8S_NAMESPACE: traintrack
  TRAINTRACK_K8S_IMAGE: traintrack:dev
  TRAINTRACK_K8S_DATABASE_URL: postgresql+psycopg://traintrack:traintrack@postgres:5432/traintrack
  TRAINTRACK_K8S_REDIS_URL: redis://redis:6379/0
  TRAINTRACK_K8S_API_URL: http://traintrack-api:8010
  TRAINTRACK_K8S_CPU_REQUEST: "1"
  TRAINTRACK_K8S_CPU_LIMIT: "2"
  TRAINTRACK_K8S_MEMORY_REQUEST: 1Gi
  TRAINTRACK_K8S_MEMORY_LIMIT: 3Gi
  TRAINTRACK_ARTIFACT_ROOT: /artifacts
  TRAINTRACK_DATA_ROOT: /data
  TRAINTRACK_LOG_LEVEL: INFO
