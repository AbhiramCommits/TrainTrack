[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traintrack"
version = "0.1.0"
description = "Self-hostable ML experiment, data-pipeline, and artifact platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Flask==3.0.3",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pika==1.3.2",
    "redis==5.2.1",
    "pydantic==2.10.4",
    "prometheus-client==0.21.1",
    "kubernetes==31.0.0",
    "Jinja2==3.1.4",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "gunicorn==23.0.0",
    "psutil==6.1.0",
    "numpy==1.26.4",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "pre-commit==4.0.1",
    "types-requests==2.32.0.20241016",
    "types-psutil==6.1.0.20241102",
    "types-PyYAML==6.0.12.20240917",
]

[tool.setuptools.packages.find]
include = ["traintrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises real Postgres/Redis/RabbitMQ services",
    "k8s: requires a live kind cluster",
]
filterwarnings = [
    "ignore::DeprecationWarning:kubernetes.*",
]

[tool.coverage.run]
branch = true
source = ["traintrack"]
omit = [
    "traintrack/training/*",
    "traintrack/pipeline/preprocess.py",
    "traintrack/executors/kubernetes.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["traintrack", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["migrations/", "frontend/", "scripts/bench_submit.py"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
