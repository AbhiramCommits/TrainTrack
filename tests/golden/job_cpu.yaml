apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/name: traintrack-job
    traintrack.experiment-id: 22222222-2222-4222-8222-222222222222
    traintrack.run-id: 11111111-1111-4111-8111-111111111111
  name: traintrack-run-11111111-1111-4111-8111-111111111111
  namespace: traintrack
spec:
  activeDeadlineSeconds: 1920
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traintrack-job
        traintrack.experiment-id: 22222222-2222-4222-8222-222222222222
        traintrack.run-id: 11111111-1111-4111-8111-111111111111
    spec:
      containers:
      - command:
        - python
        - -m
        - traintrack.training.train
        - --run-id
        - 11111111-1111-4111-8111-111111111111
        env:
        - name: DATABASE_URL
          value: postgresql+psycopg://traintrack:traintrack@postgres:5432/traintrack
        - name: TRAINTRACK_API_KEY
          value: test-key
        - name: TRAINTRACK_API_URL
          value: http://traintrack-api:8010
        - name: TRAINTRACK_EXPERIMENT_ID
          value: 22222222-2222-4222-8222-222222222222
        - name: TRAINTRACK_JOB_KIND
          value: train
        - name: TRAINTRACK_RUN_ID
          value: 11111111-1111-4111-8111-111111111111
        image: traintrack:dev
        imagePullPolicy: IfNotPresent
        name: job
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /artifacts
          name: artifacts
      restartPolicy: Never
      serviceAccountName: traintrack-job
      volumes:
      - hostPath:
          path: /data
          type: DirectoryOrCreate
        name: data
      - hostPath:
          path: /artifacts
          type: DirectoryOrCreate
        name: artifacts
  ttlSecondsAfterFinished: 600
